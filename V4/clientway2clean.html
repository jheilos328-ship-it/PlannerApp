                });
                const data = await res.json();
                if (data.message !== 'updated!') throw new Error('Note update failed');

                //cancelNoteEdit(noteId, stuff);
                //const noteEl = document.getElementById(`note-${noteId}`);
                //if (noteEl) noteEl.dataset.noteText = stuff.toLowerCase();
                cancelNoteEdit(noteId, stuff);
                if (noteEl) noteEl.dataset.noteText = stuff.toLowerCase();
                applyProjectFilter(activeProjectId);
                showToast('Note updated');
            } catch (err) {
                console.error('saveNoteEdit failed:', err);
                showToast('Note update failed');
            }
        }

        // Add note → append one note-item and increment the counter span
        async function addNote(subjectId) {
            try {
                const input = document.getElementById(`note-input-${subjectId}`);
                const stuff = input.value.trim();
                if (!stuff) return;

                const res = await fetch(`${API}/addnote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subject_id: subjectId, stuff })
                });
                const data = await res.json();
                input.value = '';
                showToast('Note added');

                // Append only the new note row
                const notesList = document.getElementById(`notes-list-${subjectId}`);
                const item = document.createElement('div');
                item.className = 'note-item';
                item.id = `note-${data.note_id}`;
                item.dataset.noteText = data.stuff.toLowerCase();
                item.dataset.dueDate = '';
                item.dataset.priority = '';
                item.innerHTML = `
                    <div class="note-content">
                        <span class="note-text">${escapeHtml(data.stuff)}</span>
                        ${getDueLabelHtml(null, `note-due-label-${data.note_id}`)}
                    </div>
                    <div class="row-actions" data-due-actions="note-${data.note_id}" data-priority-actions="note-${data.note_id}">
                        <button type="button" class="btn-icon"
                            data-action="edit-note"
                            data-note-id="${data.note_id}"
                            data-subject-id="${subjectId}">✎</button>
                        <button type="button" class="btn-icon"
                            data-action="edit-due"
                            data-due-type="note"
                            data-due-id="${data.note_id}"
                            data-current-due="">📅</button>
                        <button type="button" class="btn-icon"
                            data-action="edit-priority"
                            data-priority-type="note"
                            data-priority-id="${data.note_id}">⚑</button>
                        <button type="button" class="btn-delete"
                            data-action="delete-note"
                            data-note-id="${data.note_id}"
                            data-subject-id="${subjectId}">🗑</button>
                    </div>
                `;
                notesList.appendChild(item);

                // Increment counter in-place — touch only this text node
                const countEl = document.getElementById(`count-${subjectId}`);
                const next = parseInt(countEl.textContent) + 1;
                countEl.textContent = `${next} note${next !== 1 ? 's' : ''}`;
                applyProjectFilter(activeProjectId);
            } catch (err) {
                console.error('addNote failed:', err);
            }
        }

        // Delete note → remove one note-item and decrement the counter span
        async function deleteNote(noteId, subjectId) {
            try {
                await fetch(`${API}/delete_note`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ note_id: noteId })
                });

                const noteEl = document.getElementById(`note-${noteId}`);
                if (noteEl) noteEl.remove();
                showToast('Note deleted');

                // Decrement counter in-place
                const countEl = document.getElementById(`count-${subjectId}`);
                const next = Math.max(0, parseInt(countEl.textContent) - 1);
                countEl.textContent = `${next} note${next !== 1 ? 's' : ''}`;
                applyProjectFilter(activeProjectId);
            } catch (err) {
                console.error('deleteNote failed:', err);
            }
        }

        // ── Single delegated click handler ─────────────────────────────
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('edit-input')) return;
            const dueEditorTarget = e.target.closest('.due-editor');
            const dueEditorAction = dueEditorTarget ? e.target.closest('.due-editor [data-action]') : null;
            if (dueEditorTarget && !dueEditorAction) return;
            const priorityEditorTarget = e.target.closest('.priority-editor');
            const priorityEditorAction = priorityEditorTarget ? e.target.closest('.priority-editor [data-action]') : null;
            if (priorityEditorTarget && !priorityEditorAction) return;

            const target = e.target.closest('[data-action]');
            if (!target) return;
            e.preventDefault();
            e.stopPropagation();
            if (typeof e.stopImmediatePropagation === 'function') {
                e.stopImmediatePropagation();
            }

            switch (target.dataset.action) {

                case 'select-project': {
                    const projectId = parseInt(target.dataset.projectId);
                    const projectName = target.dataset.projectName;
                    selectProject(projectId, projectName);
                    break;
                }

                case 'delete-project':
                    deleteProject(parseInt(target.dataset.projectId));
                    break;

                case 'edit-project':
                    startProjectEdit(parseInt(target.dataset.projectId));
                    break;

                case 'save-project':
                    saveProjectEdit(parseInt(target.dataset.projectId));
                    break;

                case 'cancel-project-edit':
                    cancelProjectEdit(parseInt(target.dataset.projectId));
                    break;

                case 'project-filter': {
                    const projectItem = target.closest('.project-item');
                    openProjectFilter(
                        parseInt(target.dataset.projectId),
                        projectItem ? projectItem.dataset.projectName : target.dataset.projectName
                    );
                    break;
                }

                case 'edit-due':
                    startDueEdit(
                        target.dataset.dueType,
                        parseInt(target.dataset.dueId),
                        target.dataset.currentDue || ''
                    );
                    break;

                case 'quick-due': {
                    const editor = target.closest('.due-editor');
                    const input = editor ? editor.querySelector('.due-input') : null;
                    if (input) input.value = getQuickDueDate(target.dataset.dueOption);
                    break;
                }

                case 'save-due': {
                    const editor = target.closest('.due-editor');
                    const input = editor ? editor.querySelector('.due-input') : null;
                    saveDueDate(target.dataset.dueType, parseInt(target.dataset.dueId), input ? input.value : '');
                    break;
                }

                case 'clear-due':
                    saveDueDate(target.dataset.dueType, parseInt(target.dataset.dueId), '');
                    break;

                case 'cancel-due':
                    cancelDueEdit(target.dataset.dueType, parseInt(target.dataset.dueId));
                    break;

                case 'edit-priority':
                    startPriorityEdit(
                        target.dataset.priorityType,
                        parseInt(target.dataset.priorityId)
                    );
                    break;

                case 'save-priority':
                    savePriority(
                        target.dataset.priorityType,
                        parseInt(target.dataset.priorityId),
                        target.dataset.priorityValue
                    );
                    break;

                case 'clear-priority':
                    savePriority(target.dataset.priorityType, parseInt(target.dataset.priorityId), '');
                    break;

                case 'cancel-priority':
                    cancelPriorityEdit(target.dataset.priorityType, parseInt(target.dataset.priorityId));
                    break;

                case 'filter-quick': {
                    const type = target.dataset.filterType;
                    if (type === 'all') {
                        clearProjectFilter(activeProjectId);
                    } else if (type === 'high') {
                        setProjectFilter(activeProjectId, { priority: 'high', due: 'all', dueDate: '', search: '' });
                    } else {
                        setProjectFilter(activeProjectId, { priority: 'all', due: type, dueDate: '', search: '' });
                    }
                    break;
                }

                case 'toggle-filter-advanced': {
                    const current = getProjectFilter(activeProjectId);
                    setProjectFilter(activeProjectId, { advancedOpen: !current.advancedOpen, panelOpen: true });
                    break;
                }

                case 'filter-priority':
                    setProjectFilter(activeProjectId, { priority: target.dataset.filterPriority, panelOpen: true });
                    break;

                case 'filter-due':
                    setProjectFilter(activeProjectId, {
                        due: target.dataset.filterDue,
                        dueDate: '',
                        panelOpen: true
                    });
                    break;

                case 'clear-project-filter':
                    clearProjectFilter(activeProjectId);
                    break;

                case 'close-project-filter':
                    setProjectFilter(activeProjectId, { panelOpen: false, advancedOpen: false });
                    break;

                case 'toggle-subject': {
                    const id = parseInt(target.dataset.subjectId);
                    const card = document.getElementById(`subject-${id}`);
                    if (!card) break;
                    card.classList.toggle('open');
                    toggleSavedSubject(activeProjectId, id);
                    break;
                }

                case 'delete-subject':
                    deleteSubject(parseInt(target.dataset.subjectId));
                    break;

                case 'edit-subject':
                    startSubjectEdit(parseInt(target.dataset.subjectId));
                    break;

                case 'save-subject':
                    saveSubjectEdit(parseInt(target.dataset.subjectId));
                    break;

                case 'cancel-subject-edit':
                    cancelSubjectEdit(parseInt(target.dataset.subjectId));
                    break;

                case 'add-note':
                    addNote(parseInt(target.dataset.subjectId));
                    break;

                case 'edit-note':
                    startNoteEdit(parseInt(target.dataset.noteId), parseInt(target.dataset.subjectId));
                    break;

                case 'save-note':
                    saveNoteEdit(parseInt(target.dataset.noteId));
                    break;

                case 'cancel-note-edit':
                    cancelNoteEdit(parseInt(target.dataset.noteId));
                    break;

                case 'delete-note':
                    deleteNote(parseInt(target.dataset.noteId), parseInt(target.dataset.subjectId));
                    break;
            }
        }, true);

        document.addEventListener('change', function(e) {
            if (!e.target.classList.contains('due-weekday') && e.target.id !== 'filter-weekday-select') return;

            e.preventDefault();
            e.stopPropagation();
            if (typeof e.stopImmediatePropagation === 'function') {
                e.stopImmediatePropagation();
            }

            if (!e.target.value) return;

            if (e.target.id === 'filter-weekday-select') {
                setProjectFilter(activeProjectId, {
                    due: 'date',
                    dueDate: toDateString(getNextWeekday(parseInt(e.target.value))),
                    panelOpen: true,
                    advancedOpen: true
                });
                return;
            }

            const editor = e.target.closest('.due-editor');
            const input = editor ? editor.querySelector('.due-input') : null;
            if (input) input.value = toDateString(getNextWeekday(parseInt(e.target.value)));
        }, true);

        document.addEventListener('input', function(e) {
            if (e.target.id !== 'filter-search-input') return;

            const current = getProjectFilter(activeProjectId);
            saveProjectFilter(activeProjectId, {
                ...current,
                search: e.target.value,
                panelOpen: true,
                advancedOpen: true
            });
            applyProjectFilter(activeProjectId);
        }, true);

        // ── Single delegated keydown handler ───────────────────────────
        document.addEventListener('keydown', function(e) {
            if (e.target.classList.contains('due-input')) {
                if (e.key !== 'Enter' && e.key !== 'Escape') return;

                e.preventDefault();
                e.stopPropagation();
                if (typeof e.stopImmediatePropagation === 'function') {
                    e.stopImmediatePropagation();
                }

                const editor = e.target.closest('.due-editor');
                if (!editor) return;

                const saveButton = editor.querySelector('[data-action="save-due"]');
                if (!saveButton) return;

                const type = saveButton.dataset.dueType;
                const id = parseInt(saveButton.dataset.dueId);
                if (e.key === 'Enter') saveDueDate(type, id, e.target.value);
                if (e.key === 'Escape') cancelDueEdit(type, id);
                return;
            }

            if (e.target.classList.contains('edit-input')) {
                if (e.key !== 'Enter' && e.key !== 'Escape') return;

                e.preventDefault();
                e.stopPropagation();
                if (typeof e.stopImmediatePropagation === 'function') {
                    e.stopImmediatePropagation();
                }

                if (e.target.dataset.editType === 'subject') {
                    const subjectId = parseInt(e.target.dataset.subjectId);
                    if (e.key === 'Enter') saveSubjectEdit(subjectId);
                    if (e.key === 'Escape') cancelSubjectEdit(subjectId);
                    return;
                }

                if (e.target.dataset.editType === 'project') {
                    const projectId = parseInt(e.target.dataset.projectId);
                    if (e.key === 'Enter') saveProjectEdit(projectId);
                    if (e.key === 'Escape') cancelProjectEdit(projectId);
                    return;
                }

                if (e.target.dataset.editType === 'note') {
                    const noteId = parseInt(e.target.dataset.noteId);
                    if (e.key === 'Enter') saveNoteEdit(noteId);
                    if (e.key === 'Escape') cancelNoteEdit(noteId);
                    return;
                }
            }

            if (e.key !== 'Enter') return;

            const id = e.target.id;
            const action = e.target.dataset.action;

            if (id === 'new-project-input' || id === 'new-subject-input' || action === 'note-input') {
                e.preventDefault();
                e.stopPropagation();
                if (typeof e.stopImmediatePropagation === 'function') {
                    e.stopImmediatePropagation();
                }
            } else {
                return;
            }

            if (id === 'new-project-input') { createProject(); return; }
            if (id === 'new-subject-input') { addSubject();    return; }
            if (action === 'note-input')    { addNote(parseInt(e.target.dataset.subjectId)); return; }
        }, true);

        // Safety net: if Safari or an injected tool turns any interaction into
        // a form submit, block the navigation so the app stays in-place.
        document.addEventListener('submit', function(e) {
            e.preventDefault();
            e.stopPropagation();
        }, true);

        // ── Wire static buttons ─────────────────────────────────────────
        document.getElementById('btn-create-project').addEventListener('click', e => {
            e.preventDefault();
            createProject();
        });

        document.getElementById('btn-add-subject').addEventListener('click', e => {
            e.preventDefault();
            addSubject();
        });

        // ── Init ────────────────────────────────────────────────────────
        loadProjects();
    </script>

</body>
</html>
