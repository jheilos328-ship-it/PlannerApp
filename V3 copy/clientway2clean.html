<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lato:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #1a1a1a;
            --sidebar-bg: #111111;
            --surface: #242424;
            --border: #333333;
            --text: #f0ece4;
            --muted: #666666;
            --accent: #c9a96e;
            --accent-dim: rgba(201, 169, 110, 0.12);
            --danger: #e05c5c;
        }

        body {
            font-family: 'Lato', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ── Sidebar ──────────────────────────────────────────────── */
        .sidebar {
            width: 260px;
            min-width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 28px 20px 16px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .sidebar-header p {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 4px;
            font-weight: 300;
        }

        .new-project-area {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }

        .new-project-area input {
            flex: 1;
            padding: 8px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: 'Lato', sans-serif;
            font-size: 0.82rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .new-project-area input:focus { border-color: var(--accent); }
        .new-project-area input::placeholder { color: var(--muted); }

        .btn-new-project {
            padding: 8px 12px;
            background: var(--accent);
            color: #1a1a1a;
            border: none;
            border-radius: 6px;
            font-family: 'Lato', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-new-project:hover { opacity: 0.85; }

        .projects-label {
            padding: 12px 16px 6px;
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
        }

        .projects-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 8px 16px;
        }

        .projects-list::-webkit-scrollbar { width: 4px; }
        .projects-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .project-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 2px;
            border: 1px solid transparent;
        }

        .project-item:hover { background: var(--surface); }

        .project-item.active {
            background: var(--accent-dim);
            border-color: rgba(201, 169, 110, 0.25);
        }

        .project-item.active .project-name { color: var(--accent); }

        .project-name {
            font-size: 0.88rem;
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .btn-delete-project {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 2px 4px;
            border-radius: 4px;
            opacity: 0;
            transition: all 0.15s;
        }

        .project-item:hover .btn-delete-project { opacity: 1; }
        .btn-delete-project:hover { color: var(--danger); }

        .no-projects {
            padding: 20px 12px;
            font-size: 0.82rem;
            color: var(--muted);
            font-weight: 300;
            line-height: 1.5;
        }

        /* ── Main ──────────────────────────────────────────────────── */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .main-header {
            padding: 28px 36px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .main-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 400;
        }

        .add-subject-area {
            display: flex;
            gap: 10px;
        }

        .add-subject-area input {
            padding: 9px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Lato', sans-serif;
            font-size: 0.88rem;
            outline: none;
            width: 220px;
            transition: border-color 0.2s;
        }

        .add-subject-area input:focus { border-color: var(--accent); }
        .add-subject-area input::placeholder { color: var(--muted); }

        .btn-add-subject {
            padding: 9px 16px;
            background: var(--accent);
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            font-family: 'Lato', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .btn-add-subject:hover { opacity: 0.85; }

        .main-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px 36px;
        }

        .main-body::-webkit-scrollbar { width: 4px; }
        .main-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        /* ── No-project splash (hidden once a project is selected) ── */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--muted);
            text-align: center;
            gap: 8px;
        }

        .empty-state .icon { font-size: 2.5rem; margin-bottom: 8px; }
        .empty-state h3 { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: #444; font-weight: 400; }
        .empty-state p { font-size: 0.85rem; font-weight: 300; }

        /* Inline "no subjects yet" — lives inside #subjects-list */
        .no-subjects-msg {
            font-size: 0.85rem;
            color: var(--muted);
            font-weight: 300;
            padding: 8px 0;
        }

        /* ── Subject Cards ──────────────────────────────────────────── */
        #subjects-list { display: flex; flex-direction: column; gap: 14px; }

        .subject-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            animation: fadeIn 0.25s ease;
            transition: border-color 0.2s;
        }

        .subject-card:hover { border-color: #444; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .subject-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            cursor: pointer;
            user-select: none;
        }

        .subject-left { display: flex; align-items: center; gap: 10px; }

        .subject-toggle {
            color: var(--muted);
            font-size: 0.7rem;
            transition: transform 0.2s;
        }

        .subject-card.open .subject-toggle { transform: rotate(90deg); }

        .subject-name {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            font-weight: 400;
        }

        .subject-right { display: flex; align-items: center; gap: 10px; }

        .note-count {
            font-size: 0.75rem;
            color: var(--muted);
            background: rgba(255,255,255,0.05);
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .btn-delete {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--muted);
            font-size: 0.9rem;
            padding: 4px;
            border-radius: 4px;
            transition: color 0.15s;
            line-height: 1;
        }

        .btn-delete:hover { color: var(--danger); }

        .notes-section {
            display: none;
            border-top: 1px solid var(--border);
            background: rgba(0,0,0,0.15);
        }

        .subject-card.open .notes-section { display: block; }

        .note-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 18px 9px 42px;
            transition: background 0.15s;
        }

        .note-item:hover { background: rgba(255,255,255,0.03); }

        .note-text {
            font-size: 0.85rem;
            color: #aaa;
            font-weight: 300;
        }

        .note-text::before { content: '—'; margin-right: 8px; color: var(--muted); }

        .add-note-area {
            display: flex;
            gap: 8px;
            padding: 10px 18px;
            border-top: 1px solid var(--border);
        }

        .add-note-area input {
            flex: 1;
            padding: 7px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: 'Lato', sans-serif;
            font-size: 0.82rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .add-note-area input:focus { border-color: var(--accent); }
        .add-note-area input::placeholder { color: var(--muted); }

        .btn-add-note {
            padding: 7px 14px;
            background: var(--surface);
            color: var(--accent);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: 'Lato', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-add-note:hover { background: var(--accent-dim); border-color: var(--accent); }

        /* ── Toast ──────────────────────────────────────────────────── */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--accent);
            color: #1a1a1a;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            opacity: 0;
            transform: translateY(8px);
            transition: all 0.25s;
            pointer-events: none;
        }

        .toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>Planner</h1>
            <p>Your projects</p>
        </div>
        <div class="new-project-area">
            <input type="text" id="new-project-input" placeholder="New project..." />
            <button type="button" class="btn-new-project" id="btn-create-project">+</button>
        </div>
        <div class="projects-label">Projects</div>
        <div class="projects-list" id="projects-list">
            <div class="no-projects">No projects yet. Create one above.</div>
        </div>
    </aside>

    <main class="main">
        <div class="main-header">
            <h2 id="project-title">Select a project</h2>
            <div class="add-subject-area" id="add-subject-area" style="display:none;">
                <input type="text" id="new-subject-input" placeholder="Add a subject..." />
                <button type="button" class="btn-add-subject" id="btn-add-subject">+ Add Subject</button>
            </div>
        </div>

        <!--
            #main-body is NEVER replaced after page load.
            #no-project-state is hidden (not removed) once a project is selected.
            #subjects-list is appended once and only its children change after that.
        -->
        <div class="main-body" id="main-body">
            <div class="empty-state" id="no-project-state">
                <div class="icon">📋</div>
                <h3>No project selected</h3>
                <p>Create or select a project from the sidebar to get started.</p>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script>
        const API = 'http://127.0.0.1:5000';
        let activeProjectId = null;
        const ACTIVE_PROJECT_KEY = 'planner-active-project';
        const OPEN_SUBJECTS_KEY = 'planner-open-subjects';

        // ── Toast ─────────────────────────────────────────────────────
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ── Escape helper ─────────────────────────────────────────────
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function saveActiveProject(projectId, projectName) {
            sessionStorage.setItem(ACTIVE_PROJECT_KEY, JSON.stringify({
                projectId,
                projectName
            }));
        }

        function clearActiveProject() {
            activeProjectId = null;
            sessionStorage.removeItem(ACTIVE_PROJECT_KEY);
        }

        function getSavedActiveProject() {
            const raw = sessionStorage.getItem(ACTIVE_PROJECT_KEY);
            if (!raw) return null;

            try {
                return JSON.parse(raw);
            } catch (err) {
                sessionStorage.removeItem(ACTIVE_PROJECT_KEY);
                return null;
            }
        }

        function getOpenSubjectsMap() {
            const raw = sessionStorage.getItem(OPEN_SUBJECTS_KEY);
            if (!raw) return {};

            try {
                const parsed = JSON.parse(raw);
                return parsed && typeof parsed === 'object' ? parsed : {};
            } catch (err) {
                sessionStorage.removeItem(OPEN_SUBJECTS_KEY);
                return {};
            }
        }

        function getOpenSubjectIds(projectId = activeProjectId) {
            if (!projectId) return [];
            const ids = getOpenSubjectsMap()[String(projectId)];
            return Array.isArray(ids) ? ids : [];
        }

        function saveOpenSubjectIds(projectId, subjectIds) {
            if (!projectId) return;
            const map = getOpenSubjectsMap();
            map[String(projectId)] = subjectIds;
            sessionStorage.setItem(OPEN_SUBJECTS_KEY, JSON.stringify(map));
        }

        function toggleSavedSubject(projectId, subjectId) {
            const subjectIds = getOpenSubjectIds(projectId);
            const nextIds = subjectIds.includes(subjectId)
                ? subjectIds.filter(id => id !== subjectId)
                : [...subjectIds, subjectId];
            saveOpenSubjectIds(projectId, nextIds);
        }

        function removeSavedSubject(projectId, subjectId) {
            const nextIds = getOpenSubjectIds(projectId).filter(id => id !== subjectId);
            saveOpenSubjectIds(projectId, nextIds);
        }

        function applyOpenSubjects(projectId = activeProjectId) {
            getOpenSubjectIds(projectId).forEach(subjectId => {
                const card = document.getElementById(`subject-${subjectId}`);
                if (card) card.classList.add('open');
            });
        }

        function ensureProjectViewVisible() {
            const splash = document.getElementById('no-project-state');
            if (splash) splash.style.display = 'none';

            const list = getOrCreateSubjectsList();
            syncNoSubjectsMsg(list);
            return list;
        }

        function showNoProjectView() {
            clearActiveProject();
            document.getElementById('project-title').textContent = 'Select a project';
            document.getElementById('add-subject-area').style.display = 'none';
            document.querySelectorAll('.project-item').forEach(el => el.classList.remove('active'));

            const splash = document.getElementById('no-project-state');
            if (splash) splash.style.display = 'flex';

            const list = document.getElementById('subjects-list');
            if (list) list.replaceChildren();
        }

        // ── DOM helpers ───────────────────────────────────────────────

        // Returns the persistent #subjects-list, creating it once if needed.
        // The list is appended to #main-body and never removed.
        function getOrCreateSubjectsList() {
            let list = document.getElementById('subjects-list');
            if (!list) {
                list = document.createElement('div');
                list.id = 'subjects-list';
                document.getElementById('main-body').appendChild(list);
            }
            return list;
        }

        // Keep the "no subjects" inline message in sync with card count.
        // Only touches that one <p> element — nothing else.
        function syncNoSubjectsMsg(list) {
            const hasCards = list.querySelector('.subject-card') !== null;
            let msg = list.querySelector('.no-subjects-msg');
            if (!hasCards) {
                if (!msg) {
                    msg = document.createElement('p');
                    msg.className = 'no-subjects-msg';
                    msg.textContent = 'No subjects yet. Add one above.';
                    list.appendChild(msg);
                }
            } else {
                if (msg) msg.remove();
            }
        }

        // Build and return a single subject card DOM node.
        // Called once per subject on initial load, then once per new subject added.
        function buildSubjectCard(subject) {
            const card = document.createElement('div');
            card.className = 'subject-card';
            card.id = `subject-${subject.subject_id}`;

            const notesHTML = subject.notes.map(n => `
                <div class="note-item" id="note-${n.note_id}">
                    <span class="note-text">${escapeHtml(n.stuff)}</span>
                    <button type="button" class="btn-delete"
                        data-action="delete-note"
                        data-note-id="${n.note_id}"
                        data-subject-id="${subject.subject_id}">🗑</button>
                </div>
            `).join('');

            card.innerHTML = `
                <div class="subject-header"
                    data-action="toggle-subject"
                    data-subject-id="${subject.subject_id}">
                    <div class="subject-left">
                        <span class="subject-toggle">▶</span>
                        <span class="subject-name">${escapeHtml(subject.subject_name)}</span>
                    </div>
                    <div class="subject-right">
                        <span class="note-count" id="count-${subject.subject_id}">
                            ${subject.notes.length} note${subject.notes.length !== 1 ? 's' : ''}
                        </span>
                        <button type="button" class="btn-delete"
                            data-action="delete-subject"
                            data-subject-id="${subject.subject_id}">🗑</button>
                    </div>
                </div>
                <div class="notes-section">
                    <div class="notes-list" id="notes-list-${subject.subject_id}">
                        ${notesHTML}
                    </div>
                    <div class="add-note-area">
                        <input type="text"
                            id="note-input-${subject.subject_id}"
                            placeholder="Add a note..."
                            data-action="note-input"
                            data-subject-id="${subject.subject_id}" />
                        <button type="button" class="btn-add-note"
                            data-action="add-note"
                            data-subject-id="${subject.subject_id}">+ Add</button>
                    </div>
                </div>
            `;
            return card;
        }

        // ── Initial project render ─────────────────────────────────────
        // Called once when a project is first selected (or when switching projects).
        // Replaces only the subject cards inside #subjects-list — not the list itself,
        // not #main-body, and not anything outside #subjects-list.
        function renderSubjectsInitial(subjects) {
            const list = getOrCreateSubjectsList();
            list.replaceChildren();

            subjects.forEach(s => list.appendChild(buildSubjectCard(s)));
            syncNoSubjectsMsg(list);
            applyOpenSubjects();
        }

        // ── Sidebar project list render (called once on init) ──────────
        function renderProjects(projects) {
            const list = document.getElementById('projects-list');
            if (!projects.length) {
                clearActiveProject();
                list.innerHTML = '<div class="no-projects">No projects yet. Create one above.</div>';
                return;
            }
            list.innerHTML = projects.map(p => `
                <div class="project-item"
                    id="proj-${p.project_id}"
                    data-action="select-project"
                    data-project-id="${p.project_id}"
                    data-project-name="${p.project_name}">
                    <span class="project-name">${escapeHtml(p.project_name)}</span>
                    <button type="button" class="btn-delete-project"
                        data-action="delete-project"
                        data-project-id="${p.project_id}">🗑</button>
                </div>
            `).join('');
        }

        async function selectProject(projectId, projectName) {
            activeProjectId = projectId;
            saveActiveProject(projectId, projectName);

            document.getElementById('project-title').textContent = projectName;
            document.getElementById('add-subject-area').style.display = 'flex';
            document.querySelectorAll('.project-item').forEach(el => el.classList.remove('active'));
            ensureProjectViewVisible();

            const projectEl = document.getElementById(`proj-${projectId}`);
            if (projectEl) projectEl.classList.add('active');

            await loadProject(projectId);
        }

        async function restoreActiveProject(projects) {
            const saved = getSavedActiveProject();
            if (!saved) return;

            const match = projects.find(project => project.project_id === saved.projectId);
            if (!match) {
                clearActiveProject();
                return;
            }

            await selectProject(match.project_id, match.project_name);
        }

        // ── API functions ──────────────────────────────────────────────

        async function loadProjects() {
            try {
                const res = await fetch(`${API}/showallprojects`);
                const data = await res.json();
                renderProjects(data);
                await restoreActiveProject(data);
            } catch (err) {
                console.error('loadProjects failed:', err);
            }
        }

        // Create project → append one sidebar item, never re-render the list
        async function createProject() {
            try {
                const input = document.getElementById('new-project-input');
                const name = input.value.trim();
                if (!name) return;

                const res = await fetch(`${API}/createnewproject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                const data = await res.json();
                input.value = '';
                showToast('Project created');

                const list = document.getElementById('projects-list');
                const placeholder = list.querySelector('.no-projects');
                if (placeholder) placeholder.remove();

                const item = document.createElement('div');
                item.className = 'project-item';
                item.id = `proj-${data.project_id}`;
                item.dataset.action = 'select-project';
                item.dataset.projectId = data.project_id;
                item.dataset.projectName = data.name;
                item.innerHTML = `
                    <span class="project-name">${escapeHtml(data.name)}</span>
                    <button type="button" class="btn-delete-project"
                        data-action="delete-project"
                        data-project-id="${data.project_id}">🗑</button>
                `;
                list.appendChild(item);
                await selectProject(data.project_id, data.name);
            } catch (err) {
                console.error('createProject failed:', err);
            }
        }

        // Load project subjects on first select (or project switch)
        async function loadProject(projectId) {
            try {
                ensureProjectViewVisible();
                const res = await fetch(`${API}/getaproject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ project_id: projectId })
                });
                const data = await res.json();

                renderSubjectsInitial(data);
            } catch (err) {
                console.error('loadProject failed:', err);
            }
        }

        // Add subject → append one card, touch nothing else
        async function addSubject() {
            try {
                const input = document.getElementById('new-subject-input');
                const name = input.value.trim();
                if (!name || !activeProjectId) return;

                const res = await fetch(`${API}/addsubject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, project_id: activeProjectId })
                });
                const data = await res.json();
                input.value = '';
                showToast('Subject added');

                const list = getOrCreateSubjectsList();
                const msg = list.querySelector('.no-subjects-msg');
                if (msg) msg.remove();

                list.appendChild(buildSubjectCard({
                    subject_id: data.subject_id,
                    subject_name: data.name,
                    notes: []
                }));
            } catch (err) {
                console.error('addSubject failed:', err);
            }
        }

        // Delete subject → remove one card, update "no subjects" msg if needed
        async function deleteSubject(id) {
            try {
                await fetch(`${API}/delete_subject`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });

                const card = document.getElementById(`subject-${id}`);
                if (card) card.remove();
                removeSavedSubject(activeProjectId, id);
                showToast('Subject deleted');

                // Sync the inline message — do NOT show the full empty-state splash
                // because activeProjectId is still set
                const list = document.getElementById('subjects-list');
                if (list) syncNoSubjectsMsg(list);
            } catch (err) {
                console.error('deleteSubject failed:', err);
            }
        }

        async function deleteProject(projectId) {
            try {
                await fetch(`${API}/delete_project`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ project_id: projectId })
                });

                const item = document.getElementById(`proj-${projectId}`);
                if (item) item.remove();

                if (!document.querySelector('.project-item')) {
                    document.getElementById('projects-list').innerHTML =
                        '<div class="no-projects">No projects yet. Create one above.</div>';
                }

                if (activeProjectId === projectId) {
                    showNoProjectView();
                }

                showToast('Project deleted');
            } catch (err) {
                console.error('deleteProject failed:', err);
            }
        }

        // Add note → append one note-item and increment the counter span
        async function addNote(subjectId) {
            try {
                const input = document.getElementById(`note-input-${subjectId}`);
                const stuff = input.value.trim();
                if (!stuff) return;

                const res = await fetch(`${API}/addnote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subject_id: subjectId, stuff })
                });
                const data = await res.json();
                input.value = '';
                showToast('Note added');

                // Append only the new note row
                const notesList = document.getElementById(`notes-list-${subjectId}`);
                const item = document.createElement('div');
                item.className = 'note-item';
                item.id = `note-${data.note_id}`;
                item.innerHTML = `
                    <span class="note-text">${escapeHtml(data.stuff)}</span>
                    <button type="button" class="btn-delete"
                        data-action="delete-note"
                        data-note-id="${data.note_id}"
                        data-subject-id="${subjectId}">🗑</button>
                `;
                notesList.appendChild(item);

                // Increment counter in-place — touch only this text node
                const countEl = document.getElementById(`count-${subjectId}`);
                const next = parseInt(countEl.textContent) + 1;
                countEl.textContent = `${next} note${next !== 1 ? 's' : ''}`;
            } catch (err) {
                console.error('addNote failed:', err);
            }
        }

        // Delete note → remove one note-item and decrement the counter span
        async function deleteNote(noteId, subjectId) {
            try {
                await fetch(`${API}/delete_note`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ note_id: noteId })
                });

                const noteEl = document.getElementById(`note-${noteId}`);
                if (noteEl) noteEl.remove();
                showToast('Note deleted');

                // Decrement counter in-place
                const countEl = document.getElementById(`count-${subjectId}`);
                const next = Math.max(0, parseInt(countEl.textContent) - 1);
                countEl.textContent = `${next} note${next !== 1 ? 's' : ''}`;
            } catch (err) {
                console.error('deleteNote failed:', err);
            }
        }

        // ── Single delegated click handler ─────────────────────────────
        document.addEventListener('click', function(e) {
            const target = e.target.closest('[data-action]');
            if (!target) return;
            e.preventDefault();
            e.stopPropagation();
            if (typeof e.stopImmediatePropagation === 'function') {
                e.stopImmediatePropagation();
            }

            switch (target.dataset.action) {

                case 'select-project': {
                    const projectId = parseInt(target.dataset.projectId);
                    const projectName = target.dataset.projectName;
                    selectProject(projectId, projectName);
                    break;
                }

                case 'delete-project':
                    deleteProject(parseInt(target.dataset.projectId));
                    break;

                case 'toggle-subject': {
                    const id = parseInt(target.dataset.subjectId);
                    const card = document.getElementById(`subject-${id}`);
                    if (!card) break;
                    card.classList.toggle('open');
                    toggleSavedSubject(activeProjectId, id);
                    break;
                }

                case 'delete-subject':
                    deleteSubject(parseInt(target.dataset.subjectId));
                    break;

                case 'add-note':
                    addNote(parseInt(target.dataset.subjectId));
                    break;

                case 'delete-note':
                    deleteNote(parseInt(target.dataset.noteId), parseInt(target.dataset.subjectId));
                    break;
            }
        }, true);

        // ── Single delegated keydown handler ───────────────────────────
        document.addEventListener('keydown', function(e) {
            if (e.key !== 'Enter') return;

            const id = e.target.id;
            const action = e.target.dataset.action;

            if (id === 'new-project-input' || id === 'new-subject-input' || action === 'note-input') {
                e.preventDefault();
                e.stopPropagation();
                if (typeof e.stopImmediatePropagation === 'function') {
                    e.stopImmediatePropagation();
                }
            } else {
                return;
            }

            if (id === 'new-project-input') { createProject(); return; }
            if (id === 'new-subject-input') { addSubject();    return; }
            if (action === 'note-input')    { addNote(parseInt(e.target.dataset.subjectId)); return; }
        }, true);

        // Safety net: if Safari or an injected tool turns any interaction into
        // a form submit, block the navigation so the app stays in-place.
        document.addEventListener('submit', function(e) {
            e.preventDefault();
            e.stopPropagation();
        }, true);

        // ── Wire static buttons ─────────────────────────────────────────
        document.getElementById('btn-create-project').addEventListener('click', e => {
            e.preventDefault();
            createProject();
        });

        document.getElementById('btn-add-subject').addEventListener('click', e => {
            e.preventDefault();
            addSubject();
        });

        // ── Init ────────────────────────────────────────────────────────
        loadProjects();
    </script>

</body>
</html>
